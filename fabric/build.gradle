plugins {
    id 'fabric-loom' version '1.6.12'
}

group = 'com.concertstage'
version = '1.2.1'
base { archivesName = 'concertstage-fabric-1.20.1' }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

// Shared code and assets live in ../common
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}

apply from: '../tools/ffmpeg-bundle.gradle'   // 1.2.1: FFmpeg (LGPL) built in

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
